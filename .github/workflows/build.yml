name: Build Speaker Combiner APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        run: |
          # Automatically detects if files were placed in root or a subfolder
          if [ ! -f "build.gradle.kts" ] && [ -d "SpeakerCombinerAndroid" ]; then
            echo "Switching to SpeakerCombinerAndroid subfolder..."
            cd SpeakerCombinerAndroid
          fi
          gradle assembleDebug --stacktrace --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpeakerCombiner-Debug-APK
          path: "**/build/outputs/apk/debug/*.apk"
